{% extends 'base.html' %}

{% block title %}

{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/error.css') }}">
{% endblock %}

{% block content %}

<div class="error-page">

    <div class="error-card">

        <a href="/" class="home-btn">
            Go Back Home
        </a>

    </div>

</div>

{% endblock %}
