{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block extra_css %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/register.css') }}">
{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <h2>Create Account</h2>
        <p>Join and start using AI features</p>

        <form method="POST" class="auth-form">

            <input type="text" name="username" placeholder="Username" required>

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <input type="number" name="age" placeholder="Age" min="10" max="100" required>

            <input type="text" name="profession" placeholder="Profession (e.g. Student, Developer)" required>

            <select name="purpose" required>
                <option value="">Select Purpose</option>
                <option value="study">Study</option>
                <option value="job">Job Preparation</option>
                <option value="business">Business</option>
                <option value="personal">Personal Use</option>
                <option value="other">Other</option>
            </select>

            <button type="submit">Create Account</button>

        </form>

        <p class="bottom-text">
            Already have an account? <a href="/login">Login</a>
        </p>

    </div>

</div>

{% endblock %}
